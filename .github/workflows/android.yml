name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot 4.3
        run: |
          mkdir -p $HOME/godot
          cd $HOME/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "GODOT=$HOME/godot/godot" >> $GITHUB_ENV

      - name: Download Export Templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp -r templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
          # Copy debug template to project for custom use
          cp $HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk $GITHUB_WORKSPACE/android_debug_template.apk
          ls $HOME/.local/share/godot/export_templates/4.3.stable/

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Update export preset to use custom template
        run: |
          sed -i 's|custom_template/debug=""|custom_template/debug="res://android_debug_template.apk"|' export_presets.cfg
          cat export_presets.cfg | head -30

      - name: Export APK
        run: |
          mkdir -p build
          $GODOT --headless --path . --export-debug "Android" build/BattleRoyale3D.apk 2>&1 | tee export.log
          ls -la build/ || true
          cat export.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BattleRoyale3D-APK
          path: build/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-log
          path: export.log
          if-no-files-found: ignore
